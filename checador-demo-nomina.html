<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checador Office — Demo Nómina</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#eef1f6;
    --surface:#ffffff;
    --surface-2:#f4f6fa;
    --text:#1a2233;
    --text-muted:#667085;
    --border:#e1e5ec;
    --navy:#0d1b42;
    --navy-2:#16296b;
    --green:#17a568;
    --green-dark:#0e8a55;
    --red:#d6423a;
    --red-dark:#b5342c;
    --focus:#3b6bea;
    --shadow: 0 20px 45px -22px rgba(13,27,66,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0e18; --surface:#141a2b; --surface-2:#1b2338; --text:#e9ecf5; --text-muted:#98a3c2;
      --border:#2a3350; --navy:#10214d; --navy-2:#1a2f6e; --shadow: 0 20px 45px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0e18; --surface:#141a2b; --surface-2:#1b2338; --text:#e9ecf5; --text-muted:#98a3c2;
    --border:#2a3350; --navy:#10214d; --navy-2:#1a2f6e; --shadow: 0 20px 45px -20px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px 64px; margin:0;
  }
  h1,h2,h3{font-family:'Manrope',system-ui,sans-serif; text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  input{font-family:inherit;}

  .shell{
    width:100%; max-width:420px; background:var(--surface); border-radius:26px; overflow:hidden;
    box-shadow:var(--shadow); border:1px solid var(--border); position:relative;
  }

  .demo-flag{
    position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:8;
    background:#fff; color:var(--navy); font-size:10px; font-weight:800; letter-spacing:.5px;
    text-transform:uppercase; padding:4px 10px; border-radius:100px; box-shadow:0 4px 10px rgba(0,0,0,.25);
  }

  .topbar{
    background:linear-gradient(180deg, var(--navy), var(--navy-2)); color:#fff; padding:18px 18px 16px;
    display:flex; align-items:center; gap:12px;
  }
  .logo-mark{
    width:38px;height:38px;border-radius:11px; background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
  }
  .brand{flex:1; min-width:0;}
  .brand-name{font-family:'Manrope',sans-serif; font-weight:800; font-size:16.5px; letter-spacing:.1px; line-height:1.15;}
  .brand-sub{font-size:11.5px; color:rgba(255,255,255,.55); font-weight:600; letter-spacing:.4px; text-transform:uppercase;}
  .menu-btn{
    width:36px;height:36px;border-radius:10px;border:none;background:rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff; transition:background .15s;
  }
  .menu-btn:hover{background:rgba(255,255,255,.2);}
  .menu-btn:focus-visible{outline:2px solid #fff; outline-offset:2px;}

  .subbar{
    background:var(--surface-2); border-bottom:1px solid var(--border); padding:11px 18px;
    display:flex;align-items:center;justify-content:space-between; gap:10px;
  }
  .subbar-label{font-size:13.5px; font-weight:600; color:var(--text);}
  .subbar-clock{font-size:12.5px; color:var(--text-muted); font-variant-numeric:tabular-nums; text-align:right; line-height:1.3;}
  .subbar-clock b{color:var(--text); font-weight:700; display:block; font-size:13.5px;}

  .view{padding:26px 22px 24px;}

  .avatar-wrap{display:flex; justify-content:center; margin:6px 0 22px;}
  .avatar{
    width:96px;height:96px;border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--text-muted);
  }
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:7px; letter-spacing:.2px;}
  .input-wrap{position:relative;}
  .input-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted);}
  .field input{
    width:100%; padding:14px 14px 14px 42px; border-radius:14px; border:1.5px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:15px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{border-color:var(--focus); box-shadow:0 0 0 3px rgba(59,107,234,.15);}
  .field input.err{border-color:var(--red);}

  .btn-row{display:flex; gap:12px;}
  .action-btn{
    flex:1; border:none; border-radius:16px; padding:16px 10px 14px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; color:#fff; font-family:'Manrope',sans-serif; font-weight:700; font-size:14.5px;
    transition:transform .08s, filter .15s; letter-spacing:.2px;
  }
  .action-btn:active{transform:scale(.97);}
  .action-btn:disabled{opacity:.55; cursor:not-allowed; transform:none;}
  .action-btn.entrada{background:linear-gradient(180deg, var(--green), var(--green-dark));}
  .action-btn.salida{background:linear-gradient(180deg, var(--red), var(--red-dark));}
  .action-btn:not(:disabled):hover{filter:brightness(1.06);}
  .action-btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .toast{
    margin-top:16px; padding:13px 15px; border-radius:13px; font-size:13.5px; font-weight:500;
    display:flex; gap:10px; align-items:flex-start; line-height:1.4; animation:in .18s ease;
  }
  @keyframes in{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}
  .toast.ok{background:rgba(23,165,104,.12); color:var(--green-dark); border:1px solid rgba(23,165,104,.3);}
  .toast.warn{background:rgba(214,66,58,.1); color:var(--red-dark); border:1px solid rgba(214,66,58,.28);}
  .toast strong{font-weight:700;}

  .local-banner{
    margin:0 0 16px; padding:10px 13px; border-radius:12px; font-size:12px; line-height:1.5;
    background:var(--surface-2); border:1px dashed var(--border); color:var(--text-muted);
  }

  .overlay{
    position:absolute; inset:0; background:rgba(10,14,24,.4); opacity:0; pointer-events:none;
    transition:opacity .18s; z-index:5;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:absolute; top:0; right:0; bottom:0; width:78%; max-width:300px;
    background:var(--surface); border-left:1px solid var(--border);
    transform:translateX(100%); transition:transform .2s ease; z-index:6;
    display:flex; flex-direction:column; padding:20px 16px;
  }
  .drawer.open{transform:translateX(0);}
  .drawer h3{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-muted); margin-bottom:14px;}
  .drawer-item{
    display:flex; align-items:center; gap:11px; padding:13px 12px; border-radius:12px; border:none;
    background:transparent; color:var(--text); font-size:14.5px; font-weight:600; cursor:pointer; text-align:left;
    width:100%; margin-bottom:4px;
  }
  .drawer-item:hover{background:var(--surface-2);}
  .drawer-item.active{background:var(--surface-2); color:var(--navy);}
  .drawer-item svg{flex-shrink:0; color:var(--text-muted);}

  .sv-head{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .back-btn{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--border); background:var(--surface-2);
    display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--text); flex-shrink:0;
  }
  .sv-head h2{font-size:16.5px; font-weight:800;}

  .filters{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  select{
    padding:9px 11px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:12.8px; outline:none;
  }
  select:focus{border-color:var(--focus);}

  .summary-bar{
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:13px 15px;
    margin-bottom:16px; display:flex; justify-content:space-between; align-items:baseline;
  }
  .summary-bar .num{font-family:'Manrope',sans-serif; font-weight:800; font-size:19px; font-variant-numeric:tabular-nums;}
  .summary-bar .lbl{font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.3px;}

  .section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted); margin:20px 0 10px;}
  .section-title:first-of-type{margin-top:0;}
  .section-sub{font-size:11px; color:var(--text-muted); margin:-6px 0 10px; font-weight:500;}

  .payroll-list{display:flex; flex-direction:column; gap:8px; margin-bottom:6px;}
  .payroll-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 13px;
  }
  .payroll-row .pname{font-weight:700; font-size:13px;}
  .payroll-row .pmeta{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .payroll-row .pamt{font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap;}

  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:14px;}
  table{width:100%; border-collapse:collapse; font-size:12.4px; min-width:540px;}
  th{
    text-align:left; padding:10px 11px; background:var(--surface-2); color:var(--text-muted);
    font-weight:700; text-transform:uppercase; font-size:10.2px; letter-spacing:.4px;
  }
  td{padding:10px 11px; border-top:1px solid var(--border); font-variant-numeric:tabular-nums;}
  tr.session-open td{color:var(--green-dark); font-weight:600;}
  .badge{display:inline-block; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:700;}
  .badge.open{background:rgba(23,165,104,.14); color:var(--green-dark);}
  .badge.incomplete{background:rgba(214,66,58,.12); color:var(--red-dark);}
  .empty-state{padding:30px 14px; text-align:center; color:var(--text-muted); font-size:13px;}

  .lock-box{padding:6px 0 4px; text-align:center;}
  .lock-box svg{color:var(--text-muted); margin-bottom:10px;}
  .lock-box p{font-size:13px; color:var(--text-muted); margin:6px 0 18px; line-height:1.5;}
  .worker-row{display:flex; align-items:center; gap:11px; padding:11px 4px; border-bottom:1px solid var(--border);}
  .worker-row:last-child{border-bottom:none;}
  .worker-avatar{
    width:34px;height:34px;border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center; color:var(--text-muted); flex-shrink:0; font-size:12px; font-weight:700;
  }
  .worker-info{flex:1; min-width:0;}
  .worker-name{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .worker-pin{font-size:11.5px; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .worker-sched{font-size:10.8px; color:var(--text-muted); margin-top:1px;}
  .demo-badge{font-size:9.5px; font-weight:700; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--border); padding:1px 6px; border-radius:100px; text-transform:uppercase; letter-spacing:.3px;}
  .icon-btn{
    width:30px;height:30px;border-radius:9px; border:1px solid var(--border); background:var(--surface-2);
    display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--text-muted); flex-shrink:0;
  }
  .icon-btn:hover{color:var(--red-dark); border-color:var(--red);}
  .icon-btn.eye:hover{color:var(--navy); border-color:var(--navy);}
  .icon-btn.edit:hover{color:var(--focus); border-color:var(--focus);}

  .add-form{display:flex; gap:8px; margin:16px 0 4px;}
  .add-form input{flex:1; min-width:0; padding:10px 11px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13px; outline:none;}
  .add-form input:focus{border-color:var(--focus);}
  .add-btn{
    border:none; background:var(--navy); color:#fff; border-radius:10px; padding:0 15px; font-weight:700;
    font-size:12.8px; cursor:pointer; flex-shrink:0;
  }
  .add-btn:hover{background:var(--navy-2);}
  .add-btn.full{width:100%; padding:12px; border-radius:12px;}
  .hint{font-size:11.5px; color:var(--text-muted); margin-top:6px; line-height:1.5;}

  .edit-panel{background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:14px; margin:2px 0 14px;}
  .edit-panel .field{margin-bottom:12px;}
  .edit-panel .field label{margin-bottom:5px;}
  .edit-panel .field input{padding:10px 11px 10px 12px;}
  .sched-row{display:grid; grid-template-columns:18px 68px 1fr 9px 1fr; align-items:center; gap:7px; padding:5px 0;}
  .sched-row input[type="checkbox"]{width:15px; height:15px; accent-color:var(--navy);}
  .sched-row .dow{font-weight:600; font-size:11.8px;}
  .sched-row .dash{color:var(--text-muted); font-size:11px; text-align:center;}
  .sched-row input[type="time"]{
    width:100%; padding:6px 5px; border-radius:8px; border:1.3px solid var(--border);
    background:var(--surface); color:var(--text); font-size:11px; outline:none;
  }
  .sched-row input[type="time"]:disabled{opacity:.4;}
  .sched-preview{
    margin-top:10px; padding:9px 12px; background:var(--surface); border:1px dashed var(--border);
    border-radius:10px; font-size:12px; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center;
  }
  .sched-preview b{color:var(--text); font-variant-numeric:tabular-nums;}
  .edit-actions{display:flex; gap:8px; margin-top:12px;}
  .btn-secondary{flex:1; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:10px; font-weight:700; font-size:12.5px; cursor:pointer;}
  .btn-secondary:hover{background:var(--bg);}
  .edit-actions .add-btn{flex:1;}

  .sr-only{position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div class="shell" id="shell">
  <div class="demo-flag">Demo — datos de ejemplo</div>
  <div class="topbar">
    <div class="logo-mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="#fff" stroke-width="1.8"/><path d="M12 9v4l3 2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 2h6M12 2v2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div class="brand">
      <div class="brand-name">App Checar</div>
      <div class="brand-sub">Office</div>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="mainArea"></div>

  <div class="overlay" id="overlay"></div>
  <nav class="drawer" id="drawer" aria-label="Menú principal">
    <h3>Menú</h3>
    <button class="drawer-item" data-nav="checkin">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4M10 8l4 4-4 4M14 12H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Registrar
    </button>
    <button class="drawer-item" data-nav="historial">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Historial y nómina
    </button>
    <button class="drawer-item" data-nav="trabajadores">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 19c.7-3.4 3.3-5.2 6.5-5.2s5.8 1.8 6.5 5.2M16.5 7.5A3 3 0 1 1 16 13.4M19 19c-.4-2.2-1.4-3.7-3-4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Trabajadores
    </button>
  </nav>
</div>

<script>
(function(){
  "use strict";

  var LS_KEY = "checador_demo_nomina_v1";
  var db = null, localMode = false;

  var DAYS = [
    {key:"vie", label:"Viernes"},
    {key:"sab", label:"Sábado"},
    {key:"dom", label:"Domingo"},
    {key:"lun", label:"Lunes"},
    {key:"mar", label:"Martes"},
    {key:"mie", label:"Miércoles"},
    {key:"jue", label:"Jueves"}
  ];

  var state = {
    view: "checkin",
    menuOpen: false,
    workers: [],
    records: [],
    adminPin: "1111",
    adminUnlocked: false,
    lockInput: "",
    lockErr: "",
    toast: null,
    pinInput: "",
    pinErr: false,
    histWorker: "all",
    histRange: "today",
    addName: "",
    addPin: "",
    addErr: "",
    revealed: {},
    newAdminPin: "",
    editingWorkerId: null,
    editDraft: null
  };

  // ---------- local fallback store ----------
  function loadLocal(){
    try{ var raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
    return { workers: [], records: [], adminPin: "1111" };
  }
  function saveLocal(d){ try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); }catch(e){} }
  var localStore = null;
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  // ---------- icons ----------
  var ICO = {
    person:'<svg width="46" height="46" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.6" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1-4.3 4-6.5 7.5-6.5s6.5 2.2 7.5 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    lock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2.2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7"/></svg>',
    enter:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M13 3h5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-5M17 12H4M4 12l4-4M4 12l4 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    exit:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M11 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h5M9 12h13M22 12l-4-4M22 12l-4 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    back:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    eye:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/></svg>',
    eyeOff:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 3l18 18M10.6 5.7A10.8 10.8 0 0 1 12 5.5c6.5 0 10 6.5 10 6.5a13.4 13.4 0 0 1-3.1 3.7M6.6 6.9C4 8.6 2 12 2 12s3.5 6.5 10 6.5c1.4 0 2.6-.3 3.7-.8M14.1 14.1a2.6 2.6 0 0 1-3.6-3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    shield:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 4.8-3 8.2-7 9-4-.8-7-4.2-7-9V6l7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  };

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function fmtTime(iso){ return new Date(iso).toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit"}); }
  function fmtDate(iso){ return new Date(iso).toLocaleDateString("es-MX", {day:"2-digit", month:"short"}); }
  function dayKey(iso){ var d=new Date(iso); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  function fmtHours(h){
    if(h==null) return "—";
    var hh = Math.floor(h); var mm = Math.round((h-hh)*60);
    if(mm===60){hh++; mm=0;}
    return hh+"h "+(mm<10?"0":"")+mm+"m";
  }
  function fmtMoney(v){
    if(v==null || isNaN(v)) return "—";
    return "$" + v.toLocaleString("es-MX", {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  // ---------- schedule / payroll helpers ----------
  function timeToMin(t){
    if(!t) return null;
    var p = t.split(":");
    var v = parseInt(p[0],10)*60 + parseInt(p[1]||"0",10);
    return isNaN(v) ? null : v;
  }
  function defaultSchedule(){
    var s = {};
    DAYS.forEach(function(d){ s[d.key] = {on:false, start:"09:00", end:"18:00"}; });
    return s;
  }
  function cloneSchedule(sch){
    var base = defaultSchedule();
    if(sch){
      DAYS.forEach(function(d){
        if(sch[d.key]) base[d.key] = {on: !!sch[d.key].on, start: sch[d.key].start||"09:00", end: sch[d.key].end||"18:00"};
      });
    }
    return base;
  }
  function scheduleHoursOf(sch){
    if(!sch) return 0;
    var total = 0;
    DAYS.forEach(function(d){
      var day = sch[d.key];
      if(day && day.on){
        var a = timeToMin(day.start), b = timeToMin(day.end);
        if(a!=null && b!=null && b>a) total += (b-a)/60;
      }
    });
    return total;
  }
  function scheduleSummary(sch){
    if(!sch) return "sin horario definido";
    var days = DAYS.filter(function(d){ return sch[d.key] && sch[d.key].on; });
    if(!days.length) return "sin horario definido";
    return days.map(function(d){ return d.label.slice(0,3); }).join(" · ") + " · " + fmtHours(scheduleHoursOf(sch)) + " prog.";
  }
  function fullWeekSchedule(start, end){
    var s = {};
    DAYS.forEach(function(d){ s[d.key] = {on:true, start:start, end:end}; });
    return s;
  }

  // pay week runs Friday -> Thursday
  function payWeekStart(iso){
    var d = new Date(iso); d.setHours(0,0,0,0);
    var day = d.getDay(); // 0 Sun .. 6 Sat
    var diff = (day - 5 + 7) % 7; // Fri(5) -> 0
    d.setDate(d.getDate() - diff);
    return d;
  }
  function payWeekKeyOf(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  function payWeekKey(iso){ return payWeekKeyOf(payWeekStart(iso)); }
  function dateAt(weekStart, dayOffset, hhmm){
    var d = new Date(weekStart);
    d.setDate(d.getDate()+dayOffset);
    var p = hhmm.split(":");
    d.setHours(parseInt(p[0],10), parseInt(p[1],10), 0, 0);
    return d;
  }

  // Build per-shift sessions (entrada/salida pairs, same calendar day) with a running,
  // week-to-date payroll figure: nomina = (horas acumuladas esa semana / horas programadas) * salario.
  function computeSessions(records){
    var byId = workersById();
    var byWorker = {};
    records.slice().sort(function(a,b){ return new Date(a.ts)-new Date(b.ts); }).forEach(function(r){
      (byWorker[r.workerId] = byWorker[r.workerId] || []).push(r);
    });
    var sessions = [];
    Object.keys(byWorker).forEach(function(wid){
      var open = null;
      var cumByWeek = {};
      var worker = byId[wid];
      var horasProg = worker ? scheduleHoursOf(worker.schedule) : 0;
      byWorker[wid].forEach(function(r){
        if(r.type==="entrada"){
          if(open) sessions.push({workerId:wid, workerName:open.workerName, date:open.ts, entrada:open.ts, salida:null, horas:null, status:"open", nomina:null});
          open = r;
        } else {
          if(open && dayKey(open.ts)===dayKey(r.ts)){
            var h = (new Date(r.ts)-new Date(open.ts))/3600000;
            var wk = payWeekKey(open.ts);
            cumByWeek[wk] = (cumByWeek[wk]||0) + h;
            var nomina = (worker && worker.salario && horasProg>0) ? (cumByWeek[wk]/horasProg)*worker.salario : null;
            sessions.push({workerId:wid, workerName:r.workerName, date:open.ts, entrada:open.ts, salida:r.ts, horas:h, status:"done", nomina:nomina});
            open = null;
          } else {
            sessions.push({workerId:wid, workerName:r.workerName, date:r.ts, entrada:null, salida:r.ts, horas:null, status:"incomplete", nomina:null});
          }
        }
      });
      if(open) sessions.push({workerId:wid, workerName:open.workerName, date:open.ts, entrada:open.ts, salida:null, horas:null, status:"open", nomina:null});
    });
    sessions.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    return sessions;
  }

  // Payroll for one specific pay week (Fri->Thu), for every worker who has a schedule/salario.
  function computeWeeklyPayroll(records, workers, weekStart){
    var weekKey = payWeekKeyOf(weekStart);
    var byWorker = {};
    records.forEach(function(r){ if(payWeekKey(r.ts)===weekKey) (byWorker[r.workerId]=byWorker[r.workerId]||[]).push(r); });
    var out = [];
    workers.forEach(function(w){
      var list = (byWorker[w.id]||[]).slice().sort(function(a,b){ return new Date(a.ts)-new Date(b.ts); });
      var open=null, total=0, hasOpen=false;
      list.forEach(function(r){
        if(r.type==="entrada"){ open=r; }
        else { if(open && dayKey(open.ts)===dayKey(r.ts)){ total += (new Date(r.ts)-new Date(open.ts))/3600000; } open=null; }
      });
      if(open) hasOpen = true;
      var horasProg = scheduleHoursOf(w.schedule);
      var nomina = (w.salario && horasProg>0) ? (total/horasProg)*w.salario : null;
      if(total>0 || w.salario) out.push({id:w.id, name:w.name, horas:total, horasProg:horasProg, salario:w.salario, nomina:nomina, open:hasOpen});
    });
    return out;
  }

  function renderHistorial(){
    var workers = getWorkers();
    var now = new Date();
    var records = getRecords().filter(function(r){
      if(state.histWorker!=="all" && r.workerId!==state.histWorker) return false;
      var d = new Date(r.ts);
      if(state.histRange==="today") return d.toDateString()===now.toDateString();
      if(state.histRange==="week"){ var diff=(now-d)/(1000*60*60*24); return diff<=7; }
      return true;
    });
    var sessions = computeSessions(records);
    var totalHoras = sessions.reduce(function(s,x){ return s + (x.horas||0); }, 0);

    var rows = sessions.map(function(s){
      var cls = s.status==="open" ? "session-open" : "";
      var badge = s.status==="open" ? '<span class="badge open">en curso</span>' : s.status==="incomplete" ? '<span class="badge incomplete">incompleto</span>' : "";
      return '<tr class="'+cls+'">'+
        '<td>'+fmtDate(s.date)+'</td>'+
        '<td>'+esc(s.workerName)+'</td>'+
        '<td>'+(s.entrada?fmtTime(s.entrada):"—")+'</td>'+
        '<td>'+(s.salida?fmtTime(s.salida):(s.status==="open"?badge:"—"))+'</td>'+
        '<td>'+(s.status==="incomplete"?badge:fmtHours(s.horas))+'</td>'+
        '<td>'+fmtMoney(s.nomina)+'</td>'+
      '</tr>';
    }).join("");

    var workerOpts = '<option value="all">Todos</option>' + workers.map(function(w){
      return '<option value="'+esc(w.id)+'" '+(state.histWorker===w.id?"selected":"")+'>'+esc(w.name)+'</option>';
    }).join("");

    var curWeekStart = payWeekStart(now.toISOString());
    var curWeekEnd = new Date(curWeekStart); curWeekEnd.setDate(curWeekEnd.getDate()+6);
    var weekLabel = fmtDate(curWeekStart.toISOString()) + " – " + fmtDate(curWeekEnd.toISOString());
    var payroll = computeWeeklyPayroll(getRecords(), workers, curWeekStart);
    var payrollHtml = payroll.length ? '<div class="payroll-list">' + payroll.map(function(p){
      return '<div class="payroll-row"><div><div class="pname">'+esc(p.name)+(p.open?' <span class="badge open" style="margin-left:4px">en curso</span>':'')+'</div>'+
        '<div class="pmeta">'+fmtHours(p.horas)+' de '+fmtHours(p.horasProg)+' programadas</div></div>'+
        '<div class="pamt">'+fmtMoney(p.nomina)+'</div></div>';
    }).join('') + '</div>' : '<div class="empty-state" style="padding:16px">Aún no hay registros en la semana actual.</div>';

    return ''+
    '<div class="view">'+
      '<div class="sv-head">'+
        '<button class="back-btn" id="backBtn">'+ICO.back+'</button>'+
        '<h2>Historial y nómina</h2>'+
      '</div>'+

      '<div class="section-title">Nómina · semana actual</div>'+
      '<div class="section-sub">'+weekLabel+' (viernes a jueves)</div>'+
      payrollHtml+

      '<div class="section-title">Registros</div>'+
      '<div class="filters">'+
        '<select id="histWorker">'+workerOpts+'</select>'+
        '<select id="histRange">'+
          '<option value="today" '+(state.histRange==="today"?"selected":"")+'>Hoy</option>'+
          '<option value="week" '+(state.histRange==="week"?"selected":"")+'>Últimos 7 días</option>'+
          '<option value="all" '+(state.histRange==="all"?"selected":"")+'>Todo</option>'+
        '</select>'+
      '</div>'+
      '<div class="summary-bar"><div><div class="lbl">Horas totales</div><div class="num">'+fmtHours(totalHoras)+'</div></div><div class="lbl">'+sessions.length+' turno(s)</div></div>'+
      (sessions.length ?
        '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Trabajador</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Nómina</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        : '<div class="empty-state">No hay registros en este periodo.</div>')+
      '<div class="hint">La columna Nómina es acumulada: en cada turno muestra el pago correspondiente a las horas trabajadas hasta ese punto de la semana actual (regla de 3 contra las horas programadas).</div>'+
    '</div>';
  }

  // ---------- event binding ----------
  function bindViewEvents(){
    if(state.view === "checkin"){
      var pinField = document.getElementById("pinField");
      if(pinField){
        pinField.addEventListener("input", function(e){ state.pinInput = e.target.value; state.pinErr=false; });
        pinField.addEventListener("keydown", function(e){ if(e.key==="Enter") submitCheck("entrada"); });
      }
      var be = document.getElementById("btnEntrada");
      var bs = document.getElementById("btnSalida");
      if(be) be.addEventListener("click", function(){ submitCheck("entrada"); });
      if(bs) bs.addEventListener("click", function(){ submitCheck("salida"); });
      startClock();
    }
    if(state.view === "historial"){
      var hb = document.getElementById("backBtn");
      if(hb) hb.addEventListener("click", function(){ state.view="checkin"; render(); });
      var hw = document.getElementById("histWorker");
      if(hw) hw.addEventListener("change", function(e){ state.histWorker=e.target.value; render(); });
      var hr = document.getElementById("histRange");
      if(hr) hr.addEventListener("change", function(e){ state.histRange=e.target.value; render(); });
    }
    if(state.view === "trabajadores"){
      var tb = document.getElementById("backBtn");
      if(tb) tb.addEventListener("click", function(){ state.view="checkin"; render(); });
      var lf = document.getElementById("lockField");
      if(lf){
        lf.addEventListener("input", function(e){ state.lockInput=e.target.value; });
        lf.addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });
      }
      var ub = document.getElementById("unlockBtn");
      if(ub) ub.addEventListener("click", tryUnlock);

      var an = document.getElementById("addName");
      var ap = document.getElementById("addPin");
      if(an) an.addEventListener("input", function(e){ state.addName=e.target.value; });
      if(ap) ap.addEventListener("input", function(e){ state.addPin=e.target.value; });
      var awb = document.getElementById("addWorkerBtn");
      if(awb) awb.addEventListener("click", doAddWorker);

      var nap = document.getElementById("newAdminPin");
      if(nap) nap.addEventListener("input", function(e){ state.newAdminPin=e.target.value; });
      var sap = document.getElementById("saveAdminPinBtn");
      if(sap) sap.addEventListener("click", function(){
        if(state.newAdminPin.trim()){ setAdminPin(state.newAdminPin.trim()); state.newAdminPin=""; render(); }
      });

      Array.prototype.forEach.call(document.querySelectorAll("[data-remove]"), function(btn){
        btn.addEventListener("click", function(){
          if(state.editingWorkerId === btn.getAttribute("data-remove")){ state.editingWorkerId=null; state.editDraft=null; }
          removeWorker(btn.getAttribute("data-remove"));
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-reveal]"), function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-reveal");
          state.revealed[id] = !state.revealed[id];
          render();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-edit]"), function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-edit");
          if(state.editingWorkerId === id){ state.editingWorkerId=null; state.editDraft=null; render(); return; }
          var w = getWorkers().find(function(x){ return x.id===id; });
          if(!w) return;
          state.editingWorkerId = id;
          state.editDraft = { salario: w.salario || 0, schedule: cloneSchedule(w.schedule) };
          render();
        });
      });

      // schedule editor bindings
      var salIn = document.getElementById("editSalario");
      if(salIn) salIn.addEventListener("input", function(e){ state.editDraft.salario = e.target.value; });

      Array.prototype.forEach.call(document.querySelectorAll('.sched-row input[type="checkbox"]'), function(chk){
        chk.addEventListener("change", function(e){
          var day = e.target.getAttribute("data-day");
          state.editDraft.schedule[day].on = e.target.checked;
          render();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.sched-row input[type="time"]'), function(t){
        t.addEventListener("change", function(e){
          var day = e.target.getAttribute("data-day");
          var field = e.target.getAttribute("data-field");
          state.editDraft.schedule[day][field] = e.target.value;
          render();
        });
      });

      var cancelBtn = document.getElementById("cancelEditBtn");
      if(cancelBtn) cancelBtn.addEventListener("click", function(){ state.editingWorkerId=null; state.editDraft=null; render(); });
      var saveBtn = document.getElementById("saveEditBtn");
      if(saveBtn) saveBtn.addEventListener("click", function(){
        var id = state.editingWorkerId;
        var salario = parseFloat(state.editDraft.salario);
        if(isNaN(salario) || salario<0) salario = 0;
        updateWorker(id, {salario:salario, schedule: state.editDraft.schedule});
        state.editingWorkerId = null; state.editDraft = null;
        render();
      });
    }
  }

  function tryUnlock(){
    if(state.lockInput.trim() === String(getAdminPin())){ state.adminUnlocked=true; state.lockInput=""; state.lockErr=false; }
    else { state.lockErr = true; }
    render();
  }

  function doAddWorker(){
    var name = state.addName.trim();
    var pin = state.addPin.trim();
    if(!name || !pin){ state.addErr = "Escribe un nombre y un PIN."; render(); return; }
    if(getWorkers().some(function(w){ return w.pin===pin; })){ state.addErr = "Ese PIN ya está en uso por otro trabajador."; render(); return; }
    addWorker(name, pin);
    state.addName=""; state.addPin=""; state.addErr="";
    render();
  }

  function submitCheck(type){
    var pin = state.pinInput.trim();
    if(!pin){ state.pinErr = true; render(); return; }
    var worker = getWorkers().find(function(w){ return w.pin===pin && w.active!==false; });
    if(!worker){
      state.toast = { type:"warn", icon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>', html:"<strong>PIN no reconocido.</strong><br>Verifica con tu administrador." };
      state.pinErr = true; render(); return;
    }
    var recent = getRecords().filter(function(r){ return r.workerId===worker.id; }).sort(function(a,b){ return new Date(b.ts)-new Date(a.ts); })[0];
    var dup = recent && recent.type===type && dayKey(recent.ts)===dayKey(new Date().toISOString());

    addRecord(worker, type);
    var now = new Date();
    var timeStr = now.toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit"});
    var label = type==="entrada" ? "Entrada" : "Salida";
    state.toast = {
      type:"ok",
      icon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12.5l2.5 2.5 4.5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      html:"<strong>"+label+" registrada</strong><br>"+esc(worker.name)+" · "+timeStr+(dup?"<br><span style='opacity:.8'>Nota: ya tenías un registro de "+label.toLowerCase()+" hoy.</span>":"")
    };
    state.pinInput=""; state.pinErr=false;
    render();
  }

  var clockTimer = null;
  function startClock(){
    if(clockTimer) clearInterval(clockTimer);
    tickClock();
    clockTimer = setInterval(tickClock, 1000);
  }
  function tickClock(){
    var el = document.getElementById("clock");
    if(!el){ clearInterval(clockTimer); clockTimer=null; return; }
    var now = new Date();
    var time = now.toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
    var date = now.toLocaleDateString("es-MX", {weekday:"short", day:"2-digit", month:"short"});
    el.innerHTML = "<b>"+time+"</b>"+date;
  }

  // ---------- menu ----------
  document.getElementById("menuBtn").addEventListener("click", function(){ state.menuOpen=!state.menuOpen; render(); });
  document.getElementById("overlay").addEventListener("click", function(){ state.menuOpen=false; render(); });
  Array.prototype.forEach.call(document.querySelectorAll(".drawer-item"), function(b){
    b.addEventListener("click", function(){
      state.view = b.getAttribute("data-nav");
      state.menuOpen = false;
      render();
    });
  });

  // ---------- seeding (Ibeth Fajardo / Nimbe / Julissa, per the schedules provided) ----------
  function buildSeed(){
    var ibeth = {id:uid(), name:"Ibeth Fajardo", pin:"1001", active:true, isDemo:true, salario:2023, schedule:fullWeekSchedule("09:00","18:00"), createdAt:new Date().toISOString()};
    var nimbe = {id:uid(), name:"Nimbe", pin:"1002", active:true, isDemo:true, salario:536, schedule:{
      vie:{on:true,start:"09:00",end:"12:00"}, sab:{on:true,start:"12:00",end:"20:00"}, dom:{on:true,start:"10:00",end:"18:00"},
      lun:{on:false,start:"09:00",end:"18:00"}, mar:{on:false,start:"09:00",end:"18:00"}, mie:{on:false,start:"09:00",end:"18:00"}, jue:{on:false,start:"09:00",end:"18:00"}
    }, createdAt:new Date().toISOString()};
    var julissa = {id:uid(), name:"Julissa", pin:"1003", active:true, isDemo:true, salario:1600, schedule:fullWeekSchedule("09:00","17:00"), createdAt:new Date().toISOString()};

    var workers = [ibeth, nimbe, julissa];

    var thisWeekStart = payWeekStart(new Date().toISOString());
    var prevWeekStart = new Date(thisWeekStart); prevWeekStart.setDate(prevWeekStart.getDate()-7);

    var records = [];
    function shift(worker, offset, start, end){
      records.push({workerId:worker.id, workerName:worker.name, type:"entrada", ts:dateAt(prevWeekStart, offset, start).toISOString()});
      records.push({workerId:worker.id, workerName:worker.name, type:"salida", ts:dateAt(prevWeekStart, offset, end).toISOString()});
    }
    // Ibeth: worked 6 of 7 days (missed Thursday), one short day — 51h of 63h programadas
    shift(ibeth, 0, "09:00", "18:00"); // vie
    shift(ibeth, 1, "09:00", "18:00"); // sab
    shift(ibeth, 2, "09:00", "15:00"); // dom (salió antes)
    shift(ibeth, 3, "09:00", "18:00"); // lun
    shift(ibeth, 4, "09:00", "18:00"); // mar
    shift(ibeth, 5, "09:00", "18:00"); // mie
    // jue (offset 6): faltó

    // Nimbe: cumplió viernes y domingo, salió 1h antes el sábado — 18h de 19h programadas
    shift(nimbe, 0, "09:00", "12:00"); // vie
    shift(nimbe, 1, "12:00", "19:00"); // sab (1h antes)
    shift(nimbe, 2, "10:00", "18:00"); // dom

    // Julissa: cumplió su horario completo los 7 días — 56h de 56h programadas
    for(var i=0;i<7;i++) shift(julissa, i, "09:00", "17:00");

    // Un registro "en curso" en la semana actual, para ver cómo se ve un turno abierto
    records.push({workerId:ibeth.id, workerName:ibeth.name, type:"entrada", ts:dateAt(thisWeekStart, 0, "09:00").toISOString()});

    return {workers:workers, records:records};
  }

  function seedIfEmpty(){
    if(localMode){
      if(localStore.workers.length===0){
        var seed = buildSeed();
        localStore.workers = seed.workers;
        localStore.records = seed.records;
        saveLocal(localStore);
      }
      return;
    }
    if(!db) return;
    db.collection("workers").get().then(function(snap){
      if(snap.empty){
        var seed = buildSeed();
        seed.workers.forEach(function(w){ db.collection("workers").doc(w.id).set(w); });
        seed.records.forEach(function(r){ db.collection("records").add(r); });
      }
    }).catch(function(){});
  }

  // ---------- boot ----------
  function boot(){
    if(!window.claude || typeof window.claude.use !== "function"){
      localMode = true; localStore = loadLocal(); seedIfEmpty(); render(); return;
    }
    window.claude.use("db").then(function(handle){
      if(!handle){ localMode = true; localStore = loadLocal(); seedIfEmpty(); render(); return; }
      db = handle;
      render();
      seedIfEmpty();
      db.collection("workers").onSnapshot(function(snap){
        state.workers = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, function(){});
      db.collection("records").orderBy("ts","desc").limit(500).onSnapshot(function(snap){
        state.records = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        render();
      }, function(){});
      db.doc("config/admin").onSnapshot(function(snap){
        if(snap.exists && snap.data().pin) state.adminPin = String(snap.data().pin);
        render();
      }, function(){});
    }).catch(function(){
      localMode = true; localStore = loadLocal(); seedIfEmpty(); render();
    });
    render();
  }

  boot();
})();
</script>
